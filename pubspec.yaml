name: memo_app
description: "手もとメモ ― 声も文字も、すぐ記録。アカウント不要・オフラインで使えるシンプルなメモ帳。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5

  # Local storage
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # Audio recording & playback
  record: ^7.1.1
  audioplayers: ^6.8.1
  permission_handler: ^12.0.3

  # Photo/video attachments: pick from the gallery or capture with the
  # camera (image_picker), play back attached videos (video_player).
  image_picker: ^1.1.2
  video_player: ^2.9.5

  # Offline speech-to-text
  #
  # Vendored locally (third_party/vosk_flutter) instead of the hosted
  # 0.3.48 release: the stock plugin runs recognizer.acceptWaveForm() and
  # getFinalResult() synchronously on Android's platform/main thread,
  # which is the same thread Flutter's own UI runs on — every chunk of
  # audio decoded during transcription freezes the whole app for as long
  # as native Vosk takes to process it. The vendored copy moves both onto
  # TaskRunner's background executor (the same pattern the plugin already
  # uses for model loading) so transcription no longer blocks the UI.
  vosk_flutter:
    path: third_party/vosk_flutter
  http: ^0.13.5
  archive: ^3.6.1

  # Ads & monetization
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0

  # Export / share
  share_plus: ^13.3.0

  # Backup / restore: pick a previously-saved backup .zip to restore from.
  file_picker: ^13.1.0

  # App lock: PBKDF2 hashing for the app-open password / secret recovery
  # password (AppLockService never stores the passwords themselves).
  cryptography: ^2.9.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  path_provider_platform_interface: ^2.1.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

# vosk_flutter (0.3.48) declares a narrow `permission_handler: ^10.2.0`
# constraint, but that old permission_handler_android still references the
# Flutter v1 plugin embedding (`PluginRegistry.Registrar`), which recent
# Flutter engines no longer ship — it fails to compile on Android. The
# Dart-facing API we (and vosk_flutter) actually use — Permission.microphone,
# .status, .request() — is unchanged in newer major versions, so force a
# modern permission_handler instead of waiting on vosk_flutter's pubspec to
# catch up.
#
# Pinned to 12.0.3 rather than the very latest (13.x): 13.x pulls in
# permission_handler_android 14.x, which raises its required compileSdk to
# 37 — past what the Android Gradle Plugin bundled with our current Flutter
# can compile against (max 36). permission_handler_android 13.x (pulled in
# by 12.0.3) already dropped the v1 embedding without that compileSdk jump.
dependency_overrides:
  permission_handler: ^12.0.3

flutter:
  uses-material-design: true

# assets/icon/*.png are source images for the two generators below only
# (flutter_launcher_icons, flutter_native_splash read them straight off
# disk at generation time) — deliberately not declared under flutter/assets,
# since the running app never loads them and bundling them would just add
# dead weight to the APK.
#
# `dart run flutter_launcher_icons` (re)generates the Android mipmap icons
# from these sources. adaptive_icon_foreground must already have safe-zone
# padding baked in (Android crops the outer ~40% depending on the launcher's
# mask shape), which assets/icon/icon_foreground.png does.
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# `dart run flutter_native_splash:create` (re)generates the native splash
# screens (including Android 12+'s dedicated splash screen API) from this.
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icon/icon_foreground.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/icon/icon_foreground.png"
