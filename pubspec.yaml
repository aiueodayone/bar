name: memo_app
description: "手もとメモ ― 声も文字も、すぐ記録。アカウント不要・オフラインで使えるシンプルなメモ帳。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5

  # Local storage
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # Audio recording & playback
  record: ^7.1.1
  audioplayers: ^6.8.1
  permission_handler: ^13.0.2

  # Offline speech-to-text
  vosk_flutter: ^0.3.48
  http: ^0.13.5
  archive: ^3.6.1

  # Ads & monetization
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0

  # Export / share
  share_plus: ^13.3.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# vosk_flutter (0.3.48) declares a narrow `permission_handler: ^10.2.0`
# constraint, but that old permission_handler_android still references the
# Flutter v1 plugin embedding (`PluginRegistry.Registrar`), which recent
# Flutter engines no longer ship — it fails to compile on Android. The
# Dart-facing API we (and vosk_flutter) actually use — Permission.microphone,
# .status, .request() — is unchanged in newer major versions, so force a
# modern, compiling permission_handler instead of waiting on vosk_flutter's
# pubspec to catch up.
dependency_overrides:
  permission_handler: ^13.0.2

flutter:
  uses-material-design: true
