name: memo_app
description: "広告に邪魔されない、音声メモ・文字起こし・ジャンル分類・検索ができるオフライン対応メモアプリ。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5

  # Local storage
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # Audio recording & playback
  record: ^7.1.1
  audioplayers: ^6.8.1
  permission_handler: ^10.2.0

  # Offline speech-to-text
  vosk_flutter: ^0.3.48
  http: ^0.13.5
  archive: ^3.6.1

  # Ads & monetization
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
