name: Build APK

on:
  push:
    branches:
      - claude/memo-app-development-4weqc9
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --verbose
        timeout-minutes: 12

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: memo-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # 診断用: release ビルド(R8/難読化あり)は起動直後に落ちるが、
      # 原因がR8による過剰な削除なのか、それ以外(ネイティブプラグイン等)
      # なのかを切り分けるため、難読化のない debug ビルドも並行して作る。
      # debug ビルドが開けば「R8/proguard-rulesの問題」に絞れる。
      - name: Build debug APK
        run: flutter build apk --debug --verbose
        timeout-minutes: 12

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: memo-app-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # Play に提出する署名済み AAB。アップロード鍵は GitHub Secrets から
      # 復元する(ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
      # ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS)。Secrets が未設定なら
      # 鍵なし(debug 署名)のまま AAB を作る: Play には上げられないが、
      # ビルドが壊れていないことの確認にはなる。
      # 上の APK はこの手前で作っているので従来どおり debug 署名のまま。
      # 実機に直接入れて試す用途では、署名を変えると前のビルドを一度
      # アンインストールしないと入らなくなるため、あえてそうしている。
      - name: Restore upload keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; building the AAB without release signing."
            exit 0
          fi
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=keystore/upload-keystore.jks"
          } > android/key.properties
          echo "Release signing configured from secrets."

      - name: Build release AAB
        run: flutter build appbundle --release
        timeout-minutes: 12

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: memo-app-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # 実際に持っていない(持ち得ない)様々なAndroid端末での動作確認の
  # 代わりに、GitHub Actionsのランナー上でAndroidエミュレータを起動して
  # integration_test/app_test.dart を動かす。古いAPIレベルと新しいAPI
  # レベルを両方試すことで、OSバージョン差による不具合をある程度拾える
  # ようにする(このジョブは build ジョブと独立に並行実行される)。
  integration_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # GitHub提供のランナーはハードウェア仮想化(KVM)に対応しているが、
      # ランナーのユーザーに /dev/kvm への権限が無いと、起動が極端に遅い
      # ソフトウェアエミュレーションにフォールバックしてしまう。
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration test on API ${{ matrix.api-level }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: flutter test integration_test/app_test.dart
